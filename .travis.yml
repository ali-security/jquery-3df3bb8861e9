language: node_js
dist: focal
node_js:
- '0.10'
jobs:
  include:
    # Upstream `npm test` (grunt default: jsonlint/build/jshint/jscs/uglify/
    # dist/compare_size) under node 0.10, then the real QUnit unit suite
    # (upstream ran it in browsers via TestSwarm) in headless Chrome, served
    # by PHP for the test/data/*.php ajax fixtures.
    - node_js: '20'
      # The stable addon only provides Chrome's system libraries; the suite
      # runs on a pinned Chrome for Testing build (see install below).
      addons:
        chrome: stable
      install:
        - nvm install 0.10
        - nvm use 0.10
        - node --version
        - npm --version
        - npm install
        - ./node_modules/.bin/grunt
        - nvm use 20
        - node --version
        # The driver lives in its own tree so npm 10 never reifies jQuery's
        # node 0.10 node_modules.
        - mkdir -p /tmp/driver
        - cd /tmp/driver
        - npm init -y
        - npm install puppeteer-core@22
        - cd "$TRAVIS_BUILD_DIR"
        # Chrome 156 reports a CSP violation for jQuery 1.x's focusin support
        # probe (div.setAttribute("onfocusin", ...) in src/event/support.js),
        # failing "support: Check CSP"; Chrome 155 does not, so pin it.
        - curl -sSfL -o /tmp/chrome-linux64.zip https://storage.googleapis.com/chrome-for-testing-public/155.0.8059.39/linux64/chrome-linux64.zip
        - unzip -q /tmp/chrome-linux64.zip -d /tmp
        - /tmp/chrome-linux64/chrome --version
        - php --version
      script:
        # Multiple workers are load-bearing: single-process php -S serializes
        # requests and starves the fixture iframes the suite opens.
        - PHP_CLI_SERVER_WORKERS=10 php -S 127.0.0.1:8000 -t . > /tmp/php.log 2>&1 &
        - for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/test/index.html > /dev/null && break; sleep 1; done
        - curl -sf http://127.0.0.1:8000/test/index.html > /dev/null
        # Exclusions are environment-dependent in modern headless Chrome, not
        # jQuery bugs; the runner prints each with its reason.
        # `?dev` makes test/jquery.js load dist/jquery.js, not jquery.min.js.
        - >-
          SEAL_SKIP_TESTS="ajax: #14379 - jQuery.ajax() on unload ## environment: modern Chrome forbids synchronous XHR during page unload, which this test performs||offset: fractions (see #7730 and #7885) ## environment: Blink snaps layout offsets to 1/64 px, so the expected 1000 reads back as 999.984375"
          NODE_PATH=/tmp/driver/node_modules
          CHROME_PATH=/tmp/chrome-linux64/chrome
          node test/seal-browser-runner.js "http://127.0.0.1:8000/test/index.html?dev"
